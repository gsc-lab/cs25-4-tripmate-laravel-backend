server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # Point to Laravel's public directory

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php; # index.html index.htm; (Original)

    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # This is the magic part that connects Nginx to PHP-FPM
    location ~ \.php$ {
        # 'app' is the name of our PHP service in docker-compose.yml
        # 9000 is the default port for PHP-FPM
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}